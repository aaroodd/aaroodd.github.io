# -----------------------------------------------------------------------------
# Site settings
# -----------------------------------------------------------------------------

title: Aaroodd Ujjayini Ramachandran
first_name: Aaroodd
middle_name:
last_name: Ujjayini Ramachandran
email: aaroodd@wustl.edu
description: >
  PhD student in Physics at Washington University in St. Louis. Neutrinos, dark matter, and the early Universe.
footer_text: >

  Powered by <a href="https://jekyllrb.com/" target="_blank">Jekyll</a> with <a href="https://github.com/alshedivat/al-folio" target="_blank">al-folio</a> theme.
  Built with <a href="https://claude.ai" target="_blank">Claude</a>.
keywords: physics, neutrinos, dark matter, cosmology, data science, quantitative research

url: https://aaroodd.github.io
baseurl:
last_updated: true
impressum_url:
lang: en

# -----------------------------------------------------------------------------
# Theme
# -----------------------------------------------------------------------------

# Repo info — used by al-folio for "Improve this page" links
repo_theme_light: default
repo_theme_dark: dark

# -----------------------------------------------------------------------------
# Layout
# -----------------------------------------------------------------------------

navbar_fixed: true
footer_fixed: false

search_enabled: true
search_blog_posts: true

max_width: 960px

# -----------------------------------------------------------------------------
# Open Graph & Schema.org
# -----------------------------------------------------------------------------

serve_og_image: true
og_image:

# -----------------------------------------------------------------------------
# Social integration
# -----------------------------------------------------------------------------

github_username: aaroodd
inspire_id: 2952914
scholar_userid:
orcid_id:
linkedin_username:

contact_note: >
  Feel free to reach out by email or find me on GitHub.

# -----------------------------------------------------------------------------
# Analytics and search engines
# -----------------------------------------------------------------------------

# google_analytics:
# cronitor_analytics:
# google_site_verification:
# bing_site_verification:

# -----------------------------------------------------------------------------
# Blog
# -----------------------------------------------------------------------------

blog_name: blog
blog_nav_title: blog
blog_description:
permalink: /blog/:year/:title/

pagination:
  enabled: true

related_blog_posts:
  enabled: true
  max_related: 5

# Displays the last updated date for blog posts
last_updated: true

# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------

collections:
  news:
    defaults:
      values:
        layout: post
    output: true
  projects:
    output: true

announcements:
  enabled: true
  scrollable: true
  limit: 5
  cache_duration: 86400

latest_posts:
  enabled: true
  scrollable: true
  limit: 3

# -----------------------------------------------------------------------------
# Jekyll settings
# -----------------------------------------------------------------------------

markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  math_engine: mathjax
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

# Includes & Coverage
include: ["_pages"]
exclude:
  - bin/
  - CONTRIBUTING.md
  - CUSTOMIZE.md
  - Dockerfile
  - docker-compose.yml
  - docker-compose-slim.yml
  - FAQ.md
  - Gemfile
  - Gemfile.lock
  - INSTALL.md
  - LICENSE
  - LICENSE.txt
  - package.json
  - package-lock.json
  - yarn.lock
  - node_modules/
  - vendor/
  - README.md
  - gulpfile.js
  - src/
  - particle.jpg

sass:
  style: compressed

plugins:
  - jekyll-3rd-party-libraries
  - jekyll-archives-v2
  - jekyll-cache-bust
  - jekyll-email-protect
  - jekyll-feed
  - jekyll-get-json
  - jekyll-imagemagick
  - jekyll-link-attributes
  - jekyll-minifier
  - jekyll-paginate-v2
  - jekyll-regex-replace
  - jekyll/scholar
  - jekyll-sitemap
  - jekyll-socials
  - jekyll-tabs
  - jekyll-toc
  - jemoji

# -----------------------------------------------------------------------------
# Jekyll Scholar
# -----------------------------------------------------------------------------

scholar:
  last_name: [Ramachandran]
  first_name: [Aaroodd, A.]

  style: apa
  locale: en

  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib

  replace_strings: true
  join_strings: true

  details_dir: bibliography
  details_layout: bibtex.html
  details_link: Details

  query: "@*"
  group_by: year
  group_order: descending

# -----------------------------------------------------------------------------
# Responsive images (optional)
# -----------------------------------------------------------------------------

imagemagick:
  enabled: false

# -----------------------------------------------------------------------------
# Jekyll Sitemap
# -----------------------------------------------------------------------------

defaults:
  - scope:
      path: "assets"
    values:
      sitemap: false

# -----------------------------------------------------------------------------
# Optional Features
# -----------------------------------------------------------------------------

enable_google_analytics: false
enable_cronitor_analytics: false
enable_google_verification: false
enable_bing_verification: false
enable_masonry: true
enable_math: true
enable_tooltips: false
enable_darkmode: true
enable_navbar_social: false
enable_project_categories: true
enable_medium_zoom: true
enable_progressbar: true
enable_video_embedding: false

show_social_icons: true

enable_publication_badges:
  altmetric: false
  dimensions: false
  google_scholar: false
  inspirehep: true

